[tool.ruff.lint]
ignore = ["BLE001", "DTZ007", "DTZ005", "PIE796"]

[project]
name = "ringthing"
version = "1.1.0"
description = "UI for Oring Calculation"
authors = [
    {name = "Reza",email = "sadeghimohammadreza77@gmail.com"}
]
license = "MIT"
requires-python = ">=3.12,<3.16"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "pyqt5-qt5 (==5.15.2)",
    "pyqt5 (==5.15.11)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false